<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人機上班專用任務追蹤 - Nature Pro Max</title>
    <!-- 引入 Google Fonts: Inter 與 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --font-family-base: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
        }

        body {
            /* 更換為穩定的維基百科高清馬蹄灣圖片連結，調整遮罩透明度 */
            background-color: #020617;
            background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.35)), url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Horseshoe_Bend%2C_Arizona.jpg/1920px-Horseshoe_Bend%2C_Arizona.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: var(--font-family-base);
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .glass-modal {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.5);
            cursor: pointer;
        }

        .date-input-mini {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
            color: white;
            font-size: 10px;
            outline: none;
        }

        .card-hover:hover {
            transform: translateY(-8px);
            background: rgba(15, 23, 42, 0.75);
            border-color: rgba(255, 255, 255, 0.25);
        }

        select option { background-color: #1e293b; color: white; }
    </style>
</head>
<body class="text-slate-200 antialiased font-medium">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STATUS_CONFIG = {
            pending: { label: '未寄出', bg: 'bg-slate-700', next: 'sent' },
            sent: { label: '已寄出', bg: 'bg-blue-600', next: 'received' },
            received: { label: '已收到', bg: 'bg-emerald-600', next: 'pending' }
        };

        const formatDateForInput = (dateStr) => dateStr ? dateStr.replace(/\//g, '-') : "";
        const formatDateForDisplay = (dateStr) => dateStr ? dateStr.replace(/-/g, '/') : "";

        function App() {
            const [view, setView] = useState('grid');
            const [currentDate, setCurrentDate] = useState(new Date());
            
            // 專案資料
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_tracker');
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                return parsed.map(t => ({
                    ...t,
                    subtasks: (t.subtasks || []).map(s => ({
                        ...s,
                        status: s.status || (s.completed ? 'received' : 'pending'),
                        sentDate: s.sentDate || '',
                        receivedDate: s.receivedDate || ''
                    }))
                }));
            });

            // 常規資料
            const [recurringTasks, setRecurringTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_recurring');
                return saved ? JSON.parse(saved) : [];
            });

            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("all");
            const [newProjTitle, setNewProjTitle] = useState("");
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [selectedNoteId, setSelectedNoteId] = useState(null);
            const [activeBulkId, setActiveBulkId] = useState(null);
            const [bulkText, setBulkText] = useState("");

            const [showRecurringForm, setShowRecurringForm] = useState(false);
            const [editingRecurringId, setEditingRecurringId] = useState(null);
            const [recForm, setRecForm] = useState({ projectId: '', text: '', dayOfMonth: 1, notes: '' });

            useEffect(() => localStorage.setItem('man_machine_tracker', JSON.stringify(tasks)), [tasks]);
            useEffect(() => localStorage.setItem('man_machine_recurring', JSON.stringify(recurringTasks)), [recurringTasks]);

            const filteredTasks = useMemo(() => {
                let result = tasks.filter(t => {
                    const searchLower = searchTerm.toLowerCase();
                    const hasMatchingSubtask = t.subtasks.some(s => s.text.toLowerCase().includes(searchLower) && (statusFilter === "all" || s.status === statusFilter));
                    const titleMatches = t.title.toLowerCase().includes(searchLower) && (statusFilter === "all" || t.subtasks.some(s => s.status === statusFilter));
                    return hasMatchingSubtask || titleMatches;
                });
                return [...result].sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
            }, [tasks, searchTerm, statusFilter]);

            const currentTask = useMemo(() => tasks.find(t => t.id === selectedTaskId), [tasks, selectedTaskId]);
            const noteTask = useMemo(() => tasks.find(t => t.id === selectedNoteId), [tasks, selectedNoteId]);

            const calendarDays = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                return { daysInMonth, firstDay, year, month };
            }, [currentDate]);

            const cycleStatus = (taskId, subId) => {
                const today = new Date().toLocaleDateString('zh-TW');
                setTasks(tasks.map(t => t.id === taskId ? {
                    ...t, subtasks: t.subtasks.map(s => {
                        if (s.id === subId) {
                            const nextStatus = STATUS_CONFIG[s.status].next;
                            const updated = { ...s, status: nextStatus };
                            if (nextStatus === 'sent' && !s.sentDate) updated.sentDate = today;
                            if (nextStatus === 'received' && !s.receivedDate) updated.receivedDate = today;
                            return updated;
                        }
                        return s;
                    })
                } : t));
            };

            const updateSubtaskDate = (taskId, subId, field, value) => {
                setTasks(tasks.map(t => t.id === taskId ? {
                    ...t, subtasks: t.subtasks.map(s => s.id === subId ? { ...s, [field]: formatDateForDisplay(value) } : s)
                } : t));
            };

            const saveRecurringTask = () => {
                if (!recForm.projectId || !recForm.text) return;
                if (editingRecurringId) {
                    setRecurringTasks(recurringTasks.map(t => t.id === editingRecurringId ? { ...t, ...recForm } : t));
                } else {
                    setRecurringTasks([...recurringTasks, { ...recForm, id: Date.now(), completions: [] }]);
                }
                setRecForm({ projectId: '', text: '', dayOfMonth: 1, notes: '' });
                setEditingRecurringId(null);
                setShowRecurringForm(false);
            };

            const toggleRecurringDone = (id) => {
                const currentMonthKey = `${currentDate.getFullYear()}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}`;
                setRecurringTasks(recurringTasks.map(t => {
                    if (t.id === id) {
                        const isDone = t.completions.includes(currentMonthKey);
                        return {
                            ...t,
                            completions: isDone ? t.completions.filter(m => m !== currentMonthKey) : [...t.completions, currentMonthKey]
                        };
                    }
                    return t;
                }));
            };

            return (
                <div className="max-w-[1700px] mx-auto py-10 px-8">
                    <header className="mb-10 flex flex-col xl:flex-row xl:items-center justify-between gap-6">
                        <div className="flex items-center gap-6">
                            <div className="bg-black/40 px-6 py-4 rounded-[2rem] border border-white/10 shadow-2xl">
                                <h1 className="text-3xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-300 to-emerald-300">
                                    人機上班專用任務追蹤
                                </h1>
                                <p className="text-white/40 text-[10px] font-bold tracking-widest uppercase mt-1">Scenic Workflow Interface v4.1</p>
                            </div>
                            <div className="flex bg-black/40 p-1.5 rounded-2xl border border-white/5 shadow-lg">
                                <button onClick={() => setView('grid')} className={`px-8 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'grid' ? 'bg-blue-600 text-white shadow-lg' : 'text-white/40 hover:text-white/60'}`}>主矩陣</button>
                                <button onClick={() => setView('monthly')} className={`px-8 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'monthly' ? 'bg-purple-600 text-white shadow-lg' : 'text-white/40 hover:text-white/60'}`}>📅 每月常規</button>
                            </div>
                        </div>
                        {view === 'grid' && (
                            <div className="flex gap-4">
                                <select className="bg-slate-900/90 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white outline-none cursor-pointer" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                                    <option value="all">🔍 顯示所有狀態</option>
                                    <option value="pending">⚠️ 待處理 (含未寄出)</option>
                                    <option value="sent">📡 追蹤中 (含已寄出)</option>
                                    <option value="received">✅ 已完成 (含已收到)</option>
                                </select>
                                <div className="relative group w-72">
                                    <input type="text" placeholder="搜尋關鍵字..." className="bg-black/30 border border-white/10 rounded-xl px-4 py-2.5 text-xs w-full outline-none focus:border-blue-500 text-white shadow-lg" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                    <span className="absolute right-4 top-2.5 opacity-30">🔍</span>
                                </div>
                            </div>
                        )}
                    </header>

                    {view === 'grid' ? (
                        <>
                            <form onSubmit={(e) => {
                                e.preventDefault(); if (!newProjTitle.trim()) return;
                                setTasks([{ id: Date.now(), title: newProjTitle, isPinned: false, subtasks: [], notes: "", deadline: "", gradientIndex: Math.floor(Math.random() * 4) }, ...tasks]);
                                setNewProjTitle("");
                            }} className="mb-14 flex gap-4 max-w-4xl">
                                <input className="flex-1 bg-black/40 border border-white/10 rounded-2xl text-xl text-white placeholder-white/30 px-8 py-5 focus:ring-1 focus:ring-blue-500/50 outline-none shadow-2xl transition-all" placeholder="輸入專案名稱..." value={newProjTitle} onChange={e => setNewProjTitle(e.target.value)} />
                                <button className="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black text-xl hover:bg-blue-500 transition-all shadow-xl active:scale-95">＋建立</button>
                            </form>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
                                {filteredTasks.map((t) => {
                                    const doneCount = t.subtasks.filter(s => s.status === 'received').length;
                                    const totalCount = t.subtasks.length;
                                    const progress = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

                                    return (
                                        <div key={t.id} className="glass p-10 rounded-[3rem] cursor-pointer card-hover transition-all flex flex-col justify-between min-h-[300px]" onClick={() => setSelectedTaskId(t.id)}>
                                            <div>
                                                <div className="flex justify-between items-start mb-4">
                                                    <h3 className="font-bold text-2xl text-white leading-tight pr-2 drop-shadow-md">{t.title}</h3>
                                                    {t.isPinned && <span className="text-yellow-400 text-2xl">★</span>}
                                                </div>

                                                {/* 還原漸層進度條與%顯示 */}
                                                <div className="mb-6">
                                                    <div className="flex justify-between items-end mb-2 font-black">
                                                        <span className="text-[10px] text-white/40 uppercase tracking-widest">Efficiency</span>
                                                        <span className="text-lg text-white">{progress}%</span>
                                                    </div>
                                                    <div className="h-2 w-full bg-black/50 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-blue-500 via-blue-400 to-emerald-400 transition-all duration-700 shadow-[0_0_8px_rgba(59,130,246,0.6)]" style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2 mb-4">
                                                    {t.subtasks.slice(0, 3).map(s => (
                                                        <div key={s.id} className="flex items-center gap-2 text-xs font-medium text-white/60">
                                                            <span className={`w-2 h-2 rounded-full ${s.status === 'received' ? 'bg-emerald-400' : s.status === 'sent' ? 'bg-blue-400' : 'bg-slate-500'}`}></span>
                                                            <span className="truncate">{s.text}</span>
                                                        </div>
                                                    ))}
                                                    {t.subtasks.length > 3 && <p className="text-[10px] text-white/20 pl-4 font-black">+ {t.subtasks.length - 3} MORE</p>}
                                                </div>
                                                {t.notes && (
                                                    <div className="mt-4 p-4 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 transition-all" onClick={(e) => { e.stopPropagation(); setSelectedNoteId(t.id); }}>
                                                        <p className="text-[9px] font-black text-blue-300 uppercase mb-1 tracking-tighter">📝 查看筆記</p>
                                                        <p className="text-xs text-white/50 line-clamp-1 italic">{t.notes}</p>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[10px] font-black text-white/40 uppercase tracking-[0.2em]">
                                                <span>📅 {t.deadline || "ONGOING"}</span>
                                                <span className="text-blue-400 opacity-60">DETAILS →</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                <div className="lg:col-span-1 space-y-10">
                                    <div className="glass p-10 rounded-[3.5rem]">
                                        <h2 className="text-2xl font-black text-white mb-8 flex items-center gap-4">
                                            ⚙️ 常規清單
                                            <button onClick={() => { setRecForm({ projectId: '', text: '', dayOfMonth: 1, notes: '' }); setEditingRecurringId(null); setShowRecurringForm(true); }} className="ml-auto bg-purple-600 text-white px-5 py-2 rounded-2xl text-[10px] font-black uppercase hover:bg-purple-500 transition-all shadow-lg">＋新增</button>
                                        </h2>
                                        <div className="space-y-6 max-h-[750px] overflow-y-auto custom-scrollbar pr-3">
                                            {recurringTasks.map(rt => {
                                                const proj = tasks.find(t => t.id == rt.projectId);
                                                const currentMonthKey = `${currentDate.getFullYear()}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}`;
                                                const isDone = rt.completions.includes(currentMonthKey);
                                                return (
                                                    <div key={rt.id} className={`border-2 p-8 rounded-[2.5rem] group relative transition-all ${isDone ? 'bg-emerald-500/10 border-emerald-500/20 opacity-50' : 'bg-black/40 border-white/5 hover:border-white/20'}`}>
                                                        <div className="flex justify-between items-start mb-3">
                                                            <span className="text-[10px] font-bold text-purple-400 bg-purple-400/10 px-3 py-1 rounded-lg uppercase">{proj?.title || '未分類'}</span>
                                                            <div className="flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={() => { setRecForm(rt); setEditingRecurringId(rt.id); setShowRecurringForm(true); }} className="text-white/40 hover:text-blue-400 text-xs">編輯</button>
                                                                <button onClick={() => confirm('刪除？') && setRecurringTasks(recurringTasks.filter(t => t.id !== rt.id))} className="text-white/40 hover:text-red-500 text-xs text-xl">✕</button>
                                                            </div>
                                                        </div>
                                                        <h4 className="text-white text-xl font-black mb-6 cursor-pointer" onClick={() => { setRecForm(rt); setEditingRecurringId(rt.id); setShowRecurringForm(true); }}>{rt.text}</h4>
                                                        <div className="flex items-center justify-between">
                                                            <span className="text-xs font-black text-white/30 uppercase tracking-widest">每月 {rt.dayOfMonth} 日</span>
                                                            <button onClick={() => toggleRecurringDone(rt.id)} className={`px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase transition-all shadow-2xl ${isDone ? 'bg-emerald-500 text-white' : 'bg-indigo-600 text-white hover:brightness-125'}`}>{isDone ? '✓ 已完成' : '標記完成'}</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2">
                                    <div className="glass p-12 rounded-[3.5rem] h-full flex flex-col">
                                        <div className="flex justify-between items-center mb-12">
                                            <div className="flex flex-col">
                                                <h2 className="text-4xl font-black text-white uppercase tracking-tighter">Workflow Calendar</h2>
                                                <p className="text-[11px] font-bold text-purple-400 uppercase tracking-widest mt-2 ml-1">Routine Management Interface</p>
                                            </div>
                                            <div className="flex items-center gap-8 bg-black/60 p-3 rounded-[2rem] border border-white/10">
                                                <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 text-white text-2xl font-black">←</button>
                                                <div className="text-center min-w-[200px]">
                                                    <p className="text-2xl font-black text-white tracking-widest">{currentDate.toLocaleString('zh-TW', { month: 'long', year: 'numeric' })}</p>
                                                </div>
                                                <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 text-white text-2xl font-black">→</button>
                                            </div>
                                        </div>
                                        <div className="flex-1 grid grid-cols-7 gap-4">
                                            {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => <div key={d} className="text-center text-[10px] font-black text-white/20 pb-6 tracking-widest uppercase">{d}</div>)}
                                            {Array.from({ length: calendarDays.firstDay }).map((_, i) => <div key={`e-${i}`} className="opacity-0"></div>)}
                                            {Array.from({ length: calendarDays.daysInMonth }, (_, i) => i + 1).map(day => {
                                                const dayTasks = recurringTasks.filter(t => t.dayOfMonth == day);
                                                const isToday = day === new Date().getDate() && currentDate.getMonth() === new Date().getMonth();
                                                const monthKey = `${currentDate.getFullYear()}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}`;
                                                return (
                                                    <div key={day} className={`min-h-[140px] p-4 rounded-[2rem] border-2 transition-all flex flex-col ${isToday ? 'bg-blue-600/20 border-blue-400/50 shadow-inner' : 'bg-black/20 border-white/5 hover:border-white/20'}`}>
                                                        <span className={`text-sm font-black ${isToday ? 'text-blue-400 scale-125' : 'text-white/30'}`}>{day}</span>
                                                        <div className="mt-4 space-y-2 overflow-y-auto custom-scrollbar flex-1">
                                                            {dayTasks.map(dt => (
                                                                <div key={dt.id} onClick={() => { setRecForm(dt); setEditingRecurringId(dt.id); setShowRecurringForm(true); }} className={`text-[10px] p-2.5 rounded-xl font-bold transition-all cursor-pointer border shadow-lg ${dt.completions.includes(monthKey) ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 opacity-30 line-through' : 'bg-purple-600 text-white border-purple-400/40 hover:scale-105'}`}>{dt.text}</div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 備註彈窗 */}
                    {selectedNoteId && noteTask && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-8">
                            <div className="absolute inset-0 bg-black/85 backdrop-blur-lg" onClick={() => setSelectedNoteId(null)}></div>
                            <div className="glass-modal w-full max-w-2xl rounded-[3.5rem] p-12 relative z-10 animate-in zoom-in duration-300 flex flex-col max-h-[85vh]">
                                <h2 className="text-3xl font-black text-white mb-8">專案備註：{noteTask.title}</h2>
                                <textarea className="flex-1 bg-white/5 border border-white/10 rounded-3xl p-8 text-lg text-slate-200 focus:border-blue-500/50 outline-none resize-none leading-relaxed custom-scrollbar font-medium" value={noteTask.notes} onChange={e => setTasks(tasks.map(t => t.id === noteTask.id ? {...t, notes: e.target.value} : t))} />
                                <button onClick={() => setSelectedNoteId(null)} className="mt-8 bg-white text-black py-4 rounded-[2rem] font-black uppercase hover:bg-blue-500 hover:text-white transition-all">保存並關閉</button>
                            </div>
                        </div>
                    )}

                    {/* 常規編輯彈窗 */}
                    {showRecurringForm && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setShowRecurringForm(false)}></div>
                            <div className="glass-modal w-full max-w-lg rounded-[3.5rem] p-12 relative z-10 animate-in zoom-in duration-300">
                                <h3 className="text-3xl font-black text-white mb-10">{editingRecurringId ? '📝 更新常規項' : '✨ 新日常規項'}</h3>
                                <div className="space-y-8">
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-3">關聯專案</label>
                                        <select className="w-full bg-slate-900 border border-white/20 rounded-2xl p-4 text-white outline-none focus:border-purple-500 font-bold" value={recForm.projectId} onChange={e => setRecForm({...recForm, projectId: e.target.value})}>
                                            <option value="">-- 請選擇專案 --</option>
                                            {tasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-3">內容</label>
                                        <input className="w-full bg-black/20 border border-white/10 rounded-2xl p-5 text-white outline-none focus:border-purple-500 font-bold" value={recForm.text} onChange={e => setRecForm({...recForm, text: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-3 text-center">日期 (1-31)</label>
                                        <input type="number" min="1" max="31" className="w-full bg-black/20 border border-white/10 rounded-2xl p-5 text-white outline-none focus:border-purple-500 font-black text-xl text-center" value={recForm.dayOfMonth} onChange={e => setRecForm({...recForm, dayOfMonth: parseInt(e.target.value) || 1})} />
                                    </div>
                                    <div className="flex gap-4 pt-6">
                                        <button onClick={() => setShowRecurringForm(false)} className="flex-1 text-white/30 font-black uppercase py-4">取消</button>
                                        <button onClick={saveRecurringTask} className="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-[2rem] font-black uppercase py-4 shadow-2xl hover:brightness-110">{editingRecurringId ? '更新' : '注入'}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 專案詳情：一眼看清待辦 (大螢幕優化精簡版) */}
                    {selectedTaskId && currentTask && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 lg:p-12">
                            <div className="absolute inset-0 bg-black/90 backdrop-blur-xl" onClick={() => setSelectedTaskId(null)}></div>
                            <div className="glass-modal w-full max-w-6xl max-h-[92vh] rounded-[4rem] shadow-2xl relative z-10 flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
                                <div className="p-10 border-b border-white/10 flex justify-between items-center bg-white/5">
                                    <div className="flex-1">
                                        <input className="text-4xl font-black text-white bg-transparent border-none focus:ring-0 w-full mb-2" value={currentTask.title} onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, title: e.target.value} : t))} />
                                        <div className="flex items-center gap-4">
                                            <input type="date" className="bg-transparent text-xs font-black text-blue-400 outline-none" value={currentTask.deadline} onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, deadline: e.target.value} : t))} />
                                            <button onClick={() => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, isPinned: !t.isPinned} : t))} className={`text-[10px] font-black px-4 py-1.5 rounded-lg border transition-all ${currentTask.isPinned ? 'text-yellow-400 border-yellow-400/50' : 'text-white/20 border-white/5 hover:border-white/20'}`}>{currentTask.isPinned ? "★ PINNED" : "☆ PIN PROJECT"}</button>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedTaskId(null)} className="text-white/20 hover:text-white text-4xl p-2 transition-colors">✕</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-12 space-y-10 custom-scrollbar">
                                    <div className="flex gap-4 items-start">
                                        <textarea className="flex-1 bg-black/40 border border-white/10 rounded-[2.5rem] p-8 text-base text-slate-300 focus:border-blue-500/30 outline-none resize-none h-24 font-medium transition-all" placeholder="快速編輯筆記..." value={currentTask.notes} onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, notes: e.target.value} : t))} />
                                        <button onClick={() => setActiveBulkId(currentTask.id)} className="text-[11px] font-black text-blue-400 bg-blue-400/10 px-8 py-8 rounded-[2.5rem] border border-blue-400/20 hover:bg-blue-400/20 transition-all uppercase tracking-widest">⚡ 批量處理</button>
                                    </div>

                                    <div className="space-y-2.5">
                                        {currentTask.subtasks.map(sub => (
                                            <div key={sub.id} className="flex items-center gap-6 p-4 rounded-[1.5rem] bg-black/30 border border-white/5 group hover:bg-black/60 transition-all shadow-xl">
                                                <button onClick={() => cycleStatus(currentTask.id, sub.id)} className={`min-w-[100px] py-2 rounded-xl text-[10px] font-black uppercase shadow-2xl transition-all ${STATUS_CONFIG[sub.status].bg} text-white`}>{STATUS_CONFIG[sub.status].label}</button>
                                                <input className={`flex-1 bg-transparent border-none text-xl font-bold outline-none focus:ring-0 ${sub.status === 'received' ? 'line-through text-white/20 italic' : 'text-white'}`} value={sub.text} onChange={e => {
                                                    const newSub = currentTask.subtasks.map(s => s.id === sub.id ? {...s, text: e.target.value} : s);
                                                    setTasks(tasks.map(t => t.id === currentTask.id ? {...t, subtasks: newSub} : t));
                                                }} />
                                                
                                                <div className="flex gap-3">
                                                    <div className="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-xl border border-white/5">
                                                        <span className="text-[9px] font-black text-blue-400 opacity-50">S:</span>
                                                        <input type="date" className="date-input-mini" value={formatDateForInput(sub.sentDate)} onChange={e => updateSubtaskDate(currentTask.id, sub.id, 'sentDate', e.target.value)} />
                                                    </div>
                                                    <div className="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-xl border border-white/5">
                                                        <span className="text-[9px] font-black text-emerald-400 opacity-50">R:</span>
                                                        <input type="date" className="date-input-mini" value={formatDateForInput(sub.receivedDate)} onChange={e => updateSubtaskDate(currentTask.id, sub.id, 'receivedDate', e.target.value)} />
                                                    </div>
                                                </div>
                                                <button onClick={() => {
                                                    const newSub = currentTask.subtasks.filter(s => s.id !== sub.id);
                                                    setTasks(tasks.map(t => t.id === currentTask.id ? {...t, subtasks: newSub} : t));
                                                }} className="text-white/10 hover:text-red-500 opacity-0 group-hover:opacity-100 p-2 text-xl">✕</button>
                                            </div>
                                        ))}
                                    </div>

                                    {activeBulkId === currentTask.id && (
                                        <div className="animate-in slide-in-from-bottom-2 duration-300 mt-4">
                                            <textarea className="w-full h-32 p-8 bg-black/80 border-2 border-blue-500/30 rounded-[2.5rem] text-white text-lg outline-none custom-scrollbar" placeholder="一行一項貼上任務..." value={bulkText} onChange={e => setBulkText(e.target.value)} autoFocus />
                                            <div className="flex gap-4 justify-end mt-4">
                                                <button onClick={() => setActiveBulkId(null)} className="text-white/40 px-6 font-bold uppercase">取消</button>
                                                <button onClick={() => {
                                                    const lines = bulkText.split('\n').filter(line => line.trim() !== "");
                                                    if (lines.length === 0) return;
                                                    const newSubs = lines.map((text, i) => ({ id: Date.now() + i, text: text.trim(), status: 'pending', sentDate: '', receivedDate: '' }));
                                                    setTasks(tasks.map(t => t.id === currentTask.id ? { ...t, subtasks: [...t.subtasks, ...newSubs] } : t));
                                                    setBulkText(""); setActiveBulkId(null);
                                                }} className="bg-blue-600 text-white px-10 py-3 rounded-2xl font-black uppercase text-xs shadow-2xl">注入任務</button>
                                            </div>
                                        </div>
                                    )}

                                    <input className="w-full bg-white/5 border border-dashed border-white/10 rounded-[2.5rem] px-8 py-6 text-xl text-center placeholder-white/10 hover:bg-white/10 outline-none font-bold mt-4" placeholder="+ 點擊或輸入單個細項並按 Enter 快速建立" onKeyDown={e => {
                                        if (e.key === 'Enter' && e.target.value.trim()) {
                                            const newSub = { id: Date.now(), text: e.target.value, status: 'pending', sentDate: '', receivedDate: '' };
                                            setTasks(tasks.map(t => t.id === currentTask.id ? { ...t, subtasks: [...t.subtasks, newSub] } : t));
                                            e.target.value = "";
                                        }
                                    }} />
                                </div>
                                
                                <div className="p-10 bg-black/60 text-center border-t border-white/5">
                                    <button onClick={() => confirm('⚠️ 警告：確定要永久銷毀此專案矩陣？') && (setTasks(tasks.filter(t => t.id !== currentTask.id)), setSelectedTaskId(null))} className="text-[11px] font-black text-red-500/30 hover:text-red-500 uppercase tracking-[0.6em] transition-all hover:tracking-[0.8em]">Destroy System Permanently</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <footer className="mt-24 text-center opacity-10 text-[10px] font-black tracking-[1.5em] uppercase">
                        Nature Interface Online • Horseshoe Bend Horizon
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
