<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人機上班專用任務追蹤 - Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }
        body {
            background: radial-gradient(circle at center, #1e293b, #020617);
            min-height: 100-screen;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.5);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-200 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GRADIENTS = [
            "from-blue-600/20 to-indigo-600/20",
            "from-purple-600/20 to-rose-600/20",
            "from-emerald-600/20 to-teal-600/20",
            "from-amber-600/20 to-orange-600/20"
        ];

        function App() {
            // 核心資料：保持 key 值一致以保留舊資料
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_tracker');
                return saved ? JSON.parse(saved) : [];
            });

            const [searchTerm, setSearchTerm] = useState("");
            const [newProjTitle, setNewProjTitle] = useState("");
            const [activeBulkId, setActiveBulkId] = useState(null);
            const [bulkText, setBulkText] = useState("");

            useEffect(() => {
                localStorage.setItem('man_machine_tracker', JSON.stringify(tasks));
            }, [tasks]);

            // 搜尋與排序邏輯
            const filteredTasks = useMemo(() => {
                let result = tasks.filter(t => 
                    t.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    t.subtasks.some(s => s.text.toLowerCase().includes(searchTerm.toLowerCase()))
                );
                // 置頂的排前面
                return [...result].sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
            }, [tasks, searchTerm]);

            const addProject = (e) => {
                e.preventDefault();
                if (!newProjTitle.trim()) return;
                const newProj = { 
                    id: Date.now(), 
                    title: newProjTitle, 
                    isExpanded: true, 
                    isPinned: false,
                    subtasks: [],
                    notes: "",
                    deadline: "",
                    gradientIndex: Math.floor(Math.random() * GRADIENTS.length)
                };
                setTasks([newProj, ...tasks]);
                setNewProjTitle("");
            };

            const updateTask = (id, fields) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, ...fields } : t));
            };

            const handleBulkAdd = (projectId) => {
                const lines = bulkText.split('\n').filter(line => line.trim() !== "");
                if (lines.length === 0) { setActiveBulkId(null); return; }
                const newSub = lines.map((text, i) => ({ id: Date.now() + i, text: text.trim(), completed: false }));
                setTasks(tasks.map(t => t.id === projectId ? { ...t, subtasks: [...t.subtasks, ...newSub] } : t));
                setBulkText(""); setActiveBulkId(null);
            };

            return (
                <div className="max-w-4xl mx-auto py-12 px-6">
                    <header className="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
                        <div>
                            <h1 className="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                                人機上班專用任務追蹤
                            </h1>
                            <p className="text-slate-500 text-xs font-bold tracking-[0.3em] uppercase mt-1">Advanced Workflow Engine v2.0</p>
                        </div>
                        
                        {/* 搜尋列 */}
                        <div className="relative group">
                            <input 
                                type="text"
                                placeholder="搜尋任務或專案..."
                                className="bg-white/5 border border-white/10 rounded-2xl px-5 py-2 text-sm w-full md:w-64 outline-none focus:border-blue-500/50 transition-all"
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                            />
                            <span className="absolute right-4 top-2.5 opacity-30 group-focus-within:opacity-100 transition-opacity">🔍</span>
                        </div>
                    </header>

                    {/* 新增專案 */}
                    <form onSubmit={addProject} className="mb-12 flex gap-3 p-2 rounded-3xl glass border-white/10 shadow-2xl">
                        <input 
                            className="flex-1 bg-transparent border-none text-white placeholder-slate-600 px-6 py-4 focus:ring-0 outline-none text-lg"
                            placeholder="今天的人機協作目標是？"
                            value={newProjTitle}
                            onChange={e => setNewProjTitle(e.target.value)}
                        />
                        <button className="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black hover:bg-blue-500 transition-all active:scale-95 shadow-lg">
                            ＋
                        </button>
                    </form>

                    {/* 專案列表 */}
                    <div className="grid grid-cols-1 gap-8">
                        {filteredTasks.map((task) => {
                            const doneCount = task.subtasks.filter(s => s.completed).length;
                            const totalCount = task.subtasks.length;
                            const progress = totalCount === 0 ? 0 : Math.round((doneCount / totalCount) * 100);

                            return (
                                <div key={task.id} className={`glass rounded-[2.5rem] overflow-hidden transition-all duration-500 bg-gradient-to-br ${GRADIENTS[task.gradientIndex || 0]} ${task.isPinned ? 'ring-2 ring-blue-500/50' : ''}`}>
                                    {/* 專案頭部 */}
                                    <div className="p-7">
                                        <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                                            <div className="flex items-center gap-4 flex-1">
                                                <button 
                                                    onClick={() => updateTask(task.id, { isPinned: !task.isPinned })}
                                                    className={`text-xl transition-colors ${task.isPinned ? 'text-yellow-400' : 'text-white/20 hover:text-white/40'}`}
                                                >
                                                    {task.isPinned ? "★" : "☆"}
                                                </button>
                                                <input 
                                                    className="text-2xl font-bold text-white bg-transparent border-none focus:ring-0 w-full placeholder-white/20"
                                                    value={task.title}
                                                    onChange={e => updateTask(task.id, { title: e.target.value })}
                                                />
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <div className="flex flex-col items-end">
                                                    <span className="text-[10px] text-slate-400 font-bold mb-1 tracking-tighter">DEADLINE</span>
                                                    <input 
                                                        type="date"
                                                        className="bg-white/5 text-xs font-bold text-white p-1 rounded outline-none border border-white/10"
                                                        value={task.deadline}
                                                        onChange={e => updateTask(task.id, { deadline: e.target.value })}
                                                    />
                                                </div>
                                                <button onClick={() => confirm('刪除此專案？') && setTasks(tasks.filter(t => t.id !== task.id))} className="text-white/10 hover:text-red-500 px-2 transition-colors text-xl">✕</button>
                                            </div>
                                        </div>

                                        {/* 進度條 */}
                                        <div className="mb-6">
                                            <div className="flex justify-between text-[10px] font-black mb-2 tracking-widest text-white/40 uppercase">
                                                <span>Progress</span>
                                                <span>{progress}%</span>
                                            </div>
                                            <div className="h-1.5 w-full bg-black/20 rounded-full overflow-hidden">
                                                <div 
                                                    className="h-full bg-gradient-to-r from-blue-400 to-emerald-400 transition-all duration-1000"
                                                    style={{ width: `${progress}%` }}
                                                ></div>
                                            </div>
                                        </div>

                                        {/* 展開切換與簡短統計 */}
                                        <div className="flex justify-between items-center">
                                            <button 
                                                onClick={() => updateTask(task.id, { isExpanded: !task.isExpanded })}
                                                className="text-xs font-bold text-blue-400 hover:text-blue-300 flex items-center gap-2"
                                            >
                                                {task.isExpanded ? "收起細項 ▲" : `展開 ${totalCount} 個任務 ▼`}
                                            </button>
                                            <span className="text-[10px] font-bold text-white/20 uppercase tracking-tighter">
                                                {doneCount} / {totalCount} Tasks Done
                                            </span>
                                        </div>
                                    </div>

                                    {/* 展開內容 */}
                                    {task.isExpanded && (
                                        <div className="px-10 pb-10 space-y-8 animate-in slide-in-from-top-4 duration-300">
                                            {/* 備註區 */}
                                            <div className="bg-black/30 rounded-3xl p-6 border border-white/5">
                                                <label className="text-[10px] font-black text-blue-400/60 uppercase tracking-widest block mb-2">Project Notes</label>
                                                <textarea 
                                                    className="w-full bg-transparent border-none text-sm text-slate-300 placeholder-white/10 focus:ring-0 resize-none h-20 leading-relaxed custom-scrollbar"
                                                    placeholder="在這裡記錄一些人機協作的靈感或主管的需求..."
                                                    value={task.notes}
                                                    onChange={e => updateTask(task.id, { notes: e.target.value })}
                                                />
                                            </div>

                                            {/* 子任務 */}
                                            <div className="space-y-4">
                                                {task.subtasks.map(sub => (
                                                    <div key={sub.id} className="flex items-center gap-4 group/item">
                                                        <div 
                                                            onClick={() => {
                                                                const newSub = task.subtasks.map(s => s.id === sub.id ? {...s, completed: !s.completed} : s);
                                                                updateTask(task.id, { subtasks: newSub });
                                                            }}
                                                            className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center cursor-pointer transition-all ${sub.completed ? 'bg-white border-white' : 'bg-transparent border-white/20 hover:border-white'}`}
                                                        >
                                                            {sub.completed && <span className="text-slate-900 text-[10px] font-black">✓</span>}
                                                        </div>
                                                        <input 
                                                            className={`text-base bg-transparent border-none focus:ring-0 w-full transition-all ${sub.completed ? 'line-through text-white/20 italic' : 'text-white/80'}`}
                                                            value={sub.text}
                                                            onChange={e => {
                                                                const newSub = task.subtasks.map(s => s.id === sub.id ? {...s, text: e.target.value} : s);
                                                                updateTask(task.id, { subtasks: newSub });
                                                            }}
                                                        />
                                                        <button onClick={() => {
                                                            const newSub = task.subtasks.filter(s => s.id !== sub.id);
                                                            updateTask(task.id, { subtasks: newSub });
                                                        }} className="text-white/5 hover:text-red-400 opacity-0 group-hover/item:opacity-100 transition-all">✕</button>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* 批量/新增區 */}
                                            <div className="pt-6 border-t border-white/5">
                                                {activeBulkId === task.id ? (
                                                    <div className="space-y-4">
                                                        <textarea 
                                                            className="w-full h-40 p-5 bg-black/40 border border-white/10 rounded-3xl text-white text-sm outline-none focus:border-white/30 transition-all custom-scrollbar"
                                                            placeholder="在此貼上多行任務（一行一個）..."
                                                            value={bulkText}
                                                            onChange={e => setBulkText(e.target.value)}
                                                            autoFocus
                                                        />
                                                        <div className="flex gap-2">
                                                            <button onClick={() => handleBulkAdd(task.id)} className="bg-white text-slate-900 px-6 py-2 rounded-xl text-xs font-black uppercase tracking-widest">注入任務系統</button>
                                                            <button onClick={() => setActiveBulkId(null)} className="text-white/40 px-6 py-2 text-xs font-bold hover:text-white transition-colors">取消</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex items-center gap-4">
                                                        <input 
                                                            className="flex-1 bg-white/5 border border-dashed border-white/10 rounded-2xl px-5 py-3 text-sm placeholder-white/20 focus:border-white/40 outline-none"
                                                            placeholder="＋ 輸入任務後按 Enter..."
                                                            onKeyDown={e => {
                                                                if (e.key === 'Enter') {
                                                                    setBulkText(e.target.value);
                                                                    handleBulkAdd(task.id);
                                                                    e.target.value = "";
                                                                }
                                                            }}
                                                        />
                                                        <button 
                                                            onClick={() => setActiveBulkId(task.id)}
                                                            className="text-[10px] font-black uppercase tracking-widest bg-white/5 px-4 py-3 rounded-2xl hover:bg-white/10 transition-all"
                                                        >
                                                            ⚡ 批量模式
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    
                    <footer className="mt-20 text-center opacity-20 text-[10px] font-black tracking-[0.5em] uppercase">
                        End of Transmission • Data Localized
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
