<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人機上班專用任務追蹤 - Nature Pro</title>
    <!-- 引入 Google Fonts: Inter 與 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --font-family-base: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
        }

        body {
            /* 修正背景設定為馬蹄灣 Horseshoe Bend */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1541079143405-3c9906d7fd9b?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: var(--font-family-base);
        }

        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.6);
            cursor: pointer;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .card-hover:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(255, 255, 255, 0.3);
        }

        select option {
            background-color: #1e293b;
            color: white;
        }

        .date-input-enhanced {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            outline: none;
        }
    </style>
</head>
<body class="text-slate-200 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GRADIENTS = [
            "from-blue-600/30 to-indigo-600/30",
            "from-purple-600/30 to-rose-600/30",
            "from-emerald-600/30 to-teal-600/30",
            "from-amber-600/30 to-orange-600/30"
        ];

        const STATUS_CONFIG = {
            pending: { 
                label: '未寄出', 
                bg: 'bg-gradient-to-r from-slate-600 to-slate-700', 
                text: 'text-white',
                next: 'sent'
            },
            sent: { 
                label: '已寄出', 
                bg: 'bg-gradient-to-r from-blue-500 to-indigo-600', 
                text: 'text-white',
                next: 'received'
            },
            received: { 
                label: '已收到', 
                bg: 'bg-gradient-to-r from-emerald-500 to-teal-500', 
                text: 'text-white',
                next: 'pending'
            }
        };

        const formatDateForInput = (dateStr) => {
            if (!dateStr) return "";
            return dateStr.replace(/\//g, '-');
        };

        const formatDateForDisplay = (dateStr) => {
            if (!dateStr) return "";
            return dateStr.replace(/-/g, '/');
        };

        function App() {
            const [view, setView] = useState('grid');
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_tracker');
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                return parsed.map(t => ({
                    ...t,
                    subtasks: t.subtasks.map(s => ({
                        ...s,
                        status: s.status || (s.completed ? 'received' : 'pending'),
                        sentDate: s.sentDate || '',
                        receivedDate: s.receivedDate || ''
                    }))
                }));
            });

            const [recurringTasks, setRecurringTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_recurring');
                return saved ? JSON.parse(saved) : [];
            });

            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("all");
            const [newProjTitle, setNewProjTitle] = useState("");
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [selectedNoteId, setSelectedNoteId] = useState(null);
            const [activeBulkId, setActiveBulkId] = useState(null);
            const [bulkText, setBulkText] = useState("");

            const [showRecurringForm, setShowRecurringForm] = useState(false);
            const [editingRecurringId, setEditingRecurringId] = useState(null);
            const [recForm, setRecForm] = useState({
                projectId: '',
                text: '',
                dayOfMonth: 1,
                notes: ''
            });

            useEffect(() => {
                localStorage.setItem('man_machine_tracker', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('man_machine_recurring', JSON.stringify(recurringTasks));
            }, [recurringTasks]);

            const filteredTasks = useMemo(() => {
                let result = tasks.filter(t => {
                    const searchLower = searchTerm.toLowerCase();
                    const hasMatchingSubtask = t.subtasks.some(s => 
                        s.text.toLowerCase().includes(searchLower) && 
                        (statusFilter === "all" || s.status === statusFilter)
                    );
                    const titleMatches = t.title.toLowerCase().includes(searchLower) && 
                                       (statusFilter === "all" || t.subtasks.some(s => s.status === statusFilter));
                    
                    return hasMatchingSubtask || titleMatches;
                });
                return [...result].sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
            }, [tasks, searchTerm, statusFilter]);

            const currentTask = useMemo(() => tasks.find(t => t.id === selectedTaskId), [tasks, selectedTaskId]);
            const noteTask = useMemo(() => tasks.find(t => t.id === selectedNoteId), [tasks, selectedNoteId]);

            const calendarDays = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                return { daysInMonth, firstDay, year, month };
            }, [currentDate]);

            const cycleStatus = (taskId, subId) => {
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                setTasks(tasks.map(t => {
                    if (t.id === taskId) {
                        return {
                            ...t,
                            subtasks: t.subtasks.map(s => {
                                if (s.id === subId) {
                                    const nextStatus = STATUS_CONFIG[s.status].next;
                                    const updated = { ...s, status: nextStatus };
                                    if (nextStatus === 'sent' && !s.sentDate) updated.sentDate = today;
                                    if (nextStatus === 'received' && !s.receivedDate) updated.receivedDate = today;
                                    return updated;
                                }
                                return s;
                            })
                        };
                    }
                    return t;
                }));
            };

            const updateSubtaskDate = (taskId, subId, field, value) => {
                const formattedValue = formatDateForDisplay(value);
                setTasks(tasks.map(t => {
                    if (t.id === taskId) {
                        return {
                            ...t,
                            subtasks: t.subtasks.map(s => s.id === subId ? { ...s, [field]: formattedValue } : s)
                        };
                    }
                    return t;
                }));
            };

            const changeMonth = (offset) => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1));
            };

            const toggleRecurringDone = (id) => {
                const currentMonthKey = `${currentDate.getFullYear()}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}`;
                setRecurringTasks(recurringTasks.map(t => {
                    if (t.id === id) {
                        const isDone = t.completions.includes(currentMonthKey);
                        return {
                            ...t,
                            completions: isDone ? t.completions.filter(m => m !== currentMonthKey) : [...t.completions, currentMonthKey]
                        };
                    }
                    return t;
                }));
            };

            return (
                <div className="max-w-[1600px] mx-auto py-12 px-8">
                    <header className="mb-12 flex flex-col xl:flex-row xl:items-center justify-between gap-8">
                        <div className="flex items-center gap-6">
                            <div className="bg-black/20 p-4 rounded-[2rem] border border-white/5 shadow-2xl">
                                <h1 className="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400">
                                    人機上班專用任務追蹤
                                </h1>
                                <p className="text-slate-400 text-[10px] font-bold tracking-[0.4em] uppercase mt-1">Nature Pro Edition v3.9</p>
                            </div>
                            <div className="flex bg-black/40 p-1.5 rounded-2xl border border-white/10 shadow-xl">
                                <button onClick={() => setView('grid')} className={`px-8 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'grid' ? 'bg-blue-600 text-white shadow-lg' : 'text-white/40 hover:text-white/60'}`}>主矩陣</button>
                                <button onClick={() => setView('monthly')} className={`px-8 py-2.5 rounded-xl text-xs font-black uppercase transition-all ${view === 'monthly' ? 'bg-purple-600 text-white shadow-lg' : 'text-white/40 hover:text-white/60'}`}>📅 每月常規</button>
                            </div>
                        </div>
                        
                        {view === 'grid' && (
                            <div className="flex flex-col sm:flex-row gap-4 items-center">
                                <select className="bg-slate-900/80 border border-white/20 rounded-2xl px-6 py-3 text-sm text-slate-200 outline-none focus:border-blue-500 transition-all cursor-pointer shadow-lg w-full sm:w-auto" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                                    <option value="all">🔍 顯示所有專案</option>
                                    <option value="pending">⚠️ 待處理 (含未寄出)</option>
                                    <option value="sent">📡 追蹤中 (含已寄出)</option>
                                    <option value="received">✅ 已完成 (含已收到)</option>
                                </select>
                                <div className="relative group w-full sm:w-80">
                                    <input type="text" placeholder="搜尋關鍵字..." className="bg-black/40 border border-white/20 rounded-2xl px-6 py-3 text-sm w-full outline-none focus:border-blue-500 transition-all shadow-lg text-white" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                    <span className="absolute right-5 top-3.5 opacity-40">🔍</span>
                                </div>
                            </div>
                        )}
                    </header>

                    {view === 'grid' ? (
                        <>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                if (!newProjTitle.trim()) return;
                                const newProj = { 
                                    id: Date.now(), 
                                    title: newProjTitle, 
                                    isPinned: false,
                                    subtasks: [],
                                    notes: "",
                                    deadline: "",
                                    gradientIndex: Math.floor(Math.random() * GRADIENTS.length)
                                };
                                setTasks([newProj, ...tasks]);
                                setNewProjTitle("");
                            }} className="mb-14 flex gap-4 max-w-4xl">
                                <input className="flex-1 bg-black/40 border border-white/10 rounded-2xl text-xl text-white placeholder-slate-500 px-8 py-5 focus:ring-2 focus:ring-blue-500/50 outline-none transition-all shadow-2xl" placeholder="建立下一個大計畫..." value={newProjTitle} onChange={e => setNewProjTitle(e.target.value)} />
                                <button className="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black text-xl hover:bg-blue-500 transition-all shadow-xl active:scale-95">＋</button>
                            </form>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-10">
                                {filteredTasks.map((task) => {
                                    const done = task.subtasks.filter(s => s.status === 'received').length;
                                    const total = task.subtasks.length;
                                    const progress = total === 0 ? 0 : Math.round((done / total) * 100);

                                    return (
                                        <div key={task.id} className={`glass p-10 rounded-[3rem] cursor-pointer card-hover transition-all group relative bg-gradient-to-br ${GRADIENTS[task.gradientIndex || 0]} min-h-[320px] flex flex-col justify-between`} onClick={() => setSelectedTaskId(task.id)}>
                                            <div>
                                                <div className="flex justify-between items-start mb-6">
                                                    <h3 className="font-bold text-3xl text-white leading-tight pr-4 drop-shadow-lg">{task.title}</h3>
                                                    {task.isPinned && <span className="text-yellow-400 text-3xl drop-shadow-lg">★</span>}
                                                </div>
                                                
                                                <div className="mb-8">
                                                    <div className="flex justify-between items-end mb-3 font-black">
                                                        <span className="text-[11px] text-white/50 uppercase tracking-widest">Efficiency Matrix</span>
                                                        <span className="text-xl text-white">{progress}%</span>
                                                    </div>
                                                    <div className="h-2.5 w-full bg-black/40 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400 transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                </div>

                                                <div className="space-y-3 mb-6">
                                                    {task.subtasks.slice(0, 3).map(s => (
                                                        <div key={s.id} className="flex items-center gap-3 text-sm font-semibold text-white/80">
                                                            <span className={`w-2.5 h-2.5 rounded-full shadow-lg ${s.status === 'received' ? 'bg-emerald-400' : s.status === 'sent' ? 'bg-blue-400' : 'bg-slate-500'}`}></span>
                                                            <span className="truncate">{s.text}</span>
                                                        </div>
                                                    ))}
                                                    {total > 3 && <p className="text-xs font-black text-white/30 pl-6 italic">＋ {total - 3} more tasks</p>}
                                                </div>

                                                {task.notes && (
                                                    <div className="mt-4 p-4 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 transition-all cursor-zoom-in" onClick={(e) => { e.stopPropagation(); setSelectedNoteId(task.id); }}>
                                                        <p className="text-[11px] font-bold text-blue-300 uppercase mb-1 tracking-tighter">📝 查看備註內容</p>
                                                        <p className="text-xs text-slate-300 line-clamp-2 italic leading-relaxed">{task.notes}</p>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="mt-8 pt-6 border-t border-white/10 flex justify-between items-center text-[10px] font-black text-white/40 uppercase tracking-[0.3em]">
                                                <div className="flex items-center gap-2">
                                                    <span>📅 {task.deadline || "NO DEADLINE"}</span>
                                                </div>
                                                <span className="group-hover:text-white transition-colors">ACCESS INTERFACE →</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                                <div className="lg:col-span-1 space-y-10">
                                    <div className="glass p-10 rounded-[3rem]">
                                        <h2 className="text-3xl font-black text-white mb-8 flex items-center gap-3 border-b border-white/10 pb-6">
                                            ⚙️ 常規控制
                                            <button onClick={() => { setRecForm({ projectId: '', text: '', dayOfMonth: 1, notes: '' }); setEditingRecurringId(null); setShowRecurringForm(true); }} className="ml-auto bg-white/10 text-white px-5 py-2.5 rounded-2xl text-xs font-black uppercase hover:bg-white/20 transition-all border border-white/10">＋ 新增</button>
                                        </h2>
                                        <div className="space-y-6 max-h-[700px] overflow-y-auto custom-scrollbar pr-3">
                                            {recurringTasks.map(rt => {
                                                const proj = tasks.find(t => t.id == rt.projectId);
                                                const currentMonthKey = `${currentDate.getFullYear()}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}`;
                                                const isDoneThisMonth = rt.completions.includes(currentMonthKey);
                                                return (
                                                    <div key={rt.id} className={`border-2 p-8 rounded-[2.5rem] group relative transition-all ${isDoneThisMonth ? 'bg-emerald-500/10 border-emerald-500/20 opacity-50' : 'bg-black/30 border-white/5 hover:border-white/20'}`}>
                                                        <div className="flex justify-between items-start mb-3">
                                                            <span className="text-[10px] font-black text-purple-400 uppercase tracking-widest bg-purple-400/10 px-3 py-1 rounded-lg">{proj?.title || '未分類'}</span>
                                                            <div className="flex gap-3">
                                                                <button onClick={() => {
                                                                    setRecForm({ projectId: rt.projectId, text: rt.text, dayOfMonth: rt.dayOfMonth, notes: rt.notes });
                                                                    setEditingRecurringId(rt.id);
                                                                    setShowRecurringForm(true);
                                                                }} className="text-white/30 hover:text-blue-400 text-xs font-bold opacity-0 group-hover:opacity-100">編輯</button>
                                                                <button onClick={() => confirm('刪除？') && setRecurringTasks(recurringTasks.filter(t => t.id !== rt.id))} className="text-white/30 hover:text-red-500 text-xs font-bold opacity-0 group-hover:opacity-100">✕</button>
                                                            </div>
                                                        </div>
                                                        <h4 className="text-white text-xl font-black mb-6 cursor-pointer">{rt.text}</h4>
                                                        <div className="flex items-center justify-between">
                                                            <span className="text-[11px] font-bold text-white/40">每月 {rt.dayOfMonth} 號</span>
                                                            <button onClick={() => toggleRecurringDone(rt.id)} className={`px-6 py-2.5 rounded-2xl text-xs font-black uppercase transition-all ${isDoneThisMonth ? 'bg-emerald-500 text-white' : 'bg-indigo-600 text-white hover:brightness-125'}`}>
                                                                {isDoneThisMonth ? '✓ 已同步' : '標記完成'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2">
                                    <div className="glass p-12 rounded-[3.5rem] h-full flex flex-col">
                                        <div className="flex justify-between items-center mb-12">
                                            <div className="flex flex-col">
                                                <h2 className="text-4xl font-black text-white uppercase tracking-tighter">Routine Matrix</h2>
                                                <p className="text-[11px] font-bold text-purple-400 uppercase tracking-widest mt-2 ml-1">每月常規任務月曆</p>
                                            </div>
                                            <div className="flex items-center gap-8 bg-black/40 p-3 rounded-[2rem] border border-white/10 shadow-2xl">
                                                <button onClick={() => changeMonth(-1)} className="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 text-white transition-all text-2xl font-black">←</button>
                                                <div className="text-center min-w-[180px]">
                                                    <p className="text-2xl font-black text-white tracking-widest">{currentDate.toLocaleString('zh-TW', { month: 'long' })}</p>
                                                    <p className="text-xs font-black text-white/30 tracking-widest">{currentDate.getFullYear()}</p>
                                                </div>
                                                <button onClick={() => changeMonth(1)} className="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 text-white transition-all text-2xl font-black">→</button>
                                            </div>
                                        </div>

                                        <div className="flex-1 grid grid-cols-7 gap-4">
                                            {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => <div key={d} className="text-center text-[10px] font-black text-white/20 pb-6 uppercase tracking-widest">{d}</div>)}
                                            {Array.from({ length: calendarDays.firstDay }).map((_, i) => <div key={`empty-${i}`} className="min-h-[140px] opacity-0"></div>)}
                                            {Array.from({ length: calendarDays.daysInMonth }, (_, i) => i + 1).map(day => {
                                                const dayTasks = recurringTasks.filter(t => t.dayOfMonth == day);
                                                const currentMonthKey = `${currentDate.getFullYear()}-${(currentDate.getMonth() + 1).toString().padStart(2, '0')}`;
                                                const isToday = day === new Date().getDate() && currentDate.getMonth() === new Date().getMonth();
                                                return (
                                                    <div key={day} className={`min-h-[140px] p-4 rounded-[2rem] border-2 transition-all flex flex-col group ${isToday ? 'bg-blue-600/20 border-blue-400/50 shadow-[inset_0_0_20px_rgba(59,130,246,0.3)]' : 'bg-black/20 border-white/5 hover:border-white/20'}`}>
                                                        <span className={`text-sm font-black ${isToday ? 'text-blue-400 scale-125' : 'text-white/30'}`}>{day}</span>
                                                        <div className="mt-4 space-y-2 overflow-y-auto custom-scrollbar flex-1">
                                                            {dayTasks.map(dt => (
                                                                <div key={dt.id} onClick={() => {
                                                                    setRecForm({ projectId: dt.projectId, text: dt.text, dayOfMonth: dt.dayOfMonth, notes: dt.notes });
                                                                    setEditingRecurringId(dt.id);
                                                                    setShowRecurringForm(true);
                                                                }} className={`text-[10px] p-2.5 rounded-xl font-bold transition-all cursor-pointer border shadow-lg ${dt.completions.includes(currentMonthKey) ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 opacity-30 line-through' : 'bg-purple-600 text-white border-purple-400/40 hover:scale-105'}`}>{dt.text}</div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedNoteId && noteTask && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-8">
                            <div className="absolute inset-0 bg-black/85 backdrop-blur-lg" onClick={() => setSelectedNoteId(null)}></div>
                            <div className="glass-modal w-full max-w-2xl rounded-[3.5rem] p-12 relative z-10 animate-in zoom-in duration-300 flex flex-col max-h-[85vh]">
                                <div className="flex justify-between items-start mb-8">
                                    <div>
                                        <h2 className="text-3xl font-black text-white mb-2 leading-tight">{noteTask.title}</h2>
                                        <span className="text-xs font-bold text-blue-400 uppercase tracking-widest">📝 詳細備註編輯中</span>
                                    </div>
                                    <button onClick={() => setSelectedNoteId(null)} className="text-white/20 hover:text-white text-4xl p-2 transition-colors">✕</button>
                                </div>
                                <textarea className="flex-1 bg-white/5 border border-white/10 rounded-3xl p-8 text-lg text-slate-200 focus:border-blue-500/50 outline-none resize-none leading-relaxed custom-scrollbar font-medium" placeholder="筆記..." value={noteTask.notes} onChange={e => setTasks(tasks.map(t => t.id === noteTask.id ? {...t, notes: e.target.value} : t))} />
                                <div className="mt-8 flex justify-center">
                                    <button onClick={() => setSelectedNoteId(null)} className="bg-white text-black px-12 py-4 rounded-[2rem] font-black uppercase tracking-widest shadow-2xl hover:bg-blue-400 hover:text-white transition-all active:scale-95">確認保存</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showRecurringForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setShowRecurringForm(false)}></div>
                            <div className="glass-modal w-full max-w-lg rounded-[3.5rem] p-12 relative z-10 animate-in zoom-in duration-300 shadow-[0_0_80px_rgba(0,0,0,0.8)]">
                                <h3 className="text-3xl font-black text-white mb-10 uppercase tracking-tighter">{editingRecurringId ? '📝 更新常規邏輯' : '✨ 注入常規計畫'}</h3>
                                <div className="space-y-8">
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-3 ml-1">關聯專案</label>
                                        <select className="w-full bg-slate-900 border border-white/20 rounded-2xl p-4 text-white outline-none focus:border-purple-500 font-bold shadow-xl" value={recForm.projectId} onChange={e => setRecForm({...recForm, projectId: e.target.value})}>
                                            <option value="">-- 請選擇專案 --</option>
                                            {tasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-3 ml-1">任務內容</label>
                                        <input className="w-full bg-black/20 border border-white/10 rounded-2xl p-5 text-white outline-none focus:border-purple-500 font-bold text-lg" value={recForm.text} onChange={e => setRecForm({...recForm, text: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-3 ml-1">執行日期 (1-31)</label>
                                        <input type="number" min="1" max="31" className="w-full bg-black/20 border border-white/10 rounded-2xl p-5 text-white outline-none focus:border-purple-500 font-black text-xl text-center" value={recForm.dayOfMonth} onChange={e => setRecForm({...recForm, dayOfMonth: parseInt(e.target.value) || 1})} />
                                    </div>
                                    <div className="flex gap-4 pt-6">
                                        <button onClick={() => setShowRecurringForm(false)} className="flex-1 text-white/30 font-black uppercase py-4 hover:text-white">取消</button>
                                        <button onClick={() => {
                                            if (!recForm.projectId || !recForm.text) return;
                                            if (editingRecurringId) {
                                                setRecurringTasks(recurringTasks.map(t => t.id === editingRecurringId ? { ...t, ...recForm } : t));
                                            } else {
                                                setRecurringTasks([...recurringTasks, { ...recForm, id: Date.now(), completions: [] }]);
                                            }
                                            setRecForm({ projectId: '', text: '', dayOfMonth: 1, notes: '' });
                                            setEditingRecurringId(null);
                                            setShowRecurringForm(false);
                                        }} className="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-[2rem] font-black uppercase py-4 shadow-2xl hover:brightness-125 transition-all">{editingRecurringId ? '更新' : '注入'}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedTaskId && currentTask && view === 'grid' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-8 lg:p-16">
                            <div className="absolute inset-0 bg-black/90 backdrop-blur-xl" onClick={() => setSelectedTaskId(null)}></div>
                            <div className="glass-modal w-full max-w-5xl max-h-[92vh] rounded-[4rem] shadow-2xl relative z-10 flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
                                <div className="p-12 border-b border-white/10 flex justify-between items-center bg-white/5">
                                    <div className="flex-1">
                                        <input className="text-4xl font-black text-white bg-transparent border-none focus:ring-0 w-full mb-4" value={currentTask.title} onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, title: e.target.value} : t))} />
                                        <div className="flex items-center gap-8">
                                            <div className="flex items-center gap-3 bg-white/5 px-4 py-2 rounded-2xl border border-white/5">
                                                <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Target Date</span>
                                                <input type="date" className="bg-transparent text-sm font-black text-blue-400 outline-none" value={currentTask.deadline} onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, deadline: e.target.value} : t))} />
                                            </div>
                                            <button onClick={() => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, isPinned: !t.isPinned} : t))} className={`text-xs font-black tracking-widest uppercase py-2 px-6 rounded-2xl border transition-all ${currentTask.isPinned ? 'text-yellow-400 border-yellow-400/50 bg-yellow-400/10' : 'text-white/20 border-white/10 hover:border-white/40'}`}>{currentTask.isPinned ? "★ Pinned" : "☆ Pin Project"}</button>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedTaskId(null)} className="text-white/20 hover:text-white text-5xl p-6 transition-colors">✕</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-12 space-y-10 custom-scrollbar">
                                    <section>
                                        <label className="text-xs font-black text-blue-400 uppercase tracking-[0.3em] block mb-4 ml-2">Internal Notes</label>
                                        <textarea className="w-full bg-black/40 border border-white/10 rounded-[2.5rem] p-8 text-lg text-slate-300 focus:border-blue-500/50 outline-none resize-none h-32 leading-relaxed transition-all font-medium custom-scrollbar" placeholder="筆記..." value={currentTask.notes} onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, notes: e.target.value} : t))} />
                                    </section>

                                    <section>
                                        <div className="flex justify-between items-center mb-6">
                                            <label className="text-xs font-black text-blue-400 uppercase tracking-[0.3em] ml-2">Operational Workflow</label>
                                            <button onClick={() => setActiveBulkId(currentTask.id)} className="text-[11px] font-black text-white/40 hover:text-blue-400 bg-white/5 px-6 py-2 rounded-full border border-white/10">⚡ 批量處理</button>
                                        </div>
                                        <div className="space-y-4">
                                            {currentTask.subtasks.map(sub => (
                                                <div key={sub.id} className="flex flex-col gap-2 p-5 rounded-[2rem] bg-black/40 border border-white/5 group hover:bg-black/60 transition-all shadow-xl">
                                                    <div className="flex items-center gap-6">
                                                        <button onClick={() => cycleStatus(currentTask.id, sub.id)} className={`status-cycle-btn min-w-[100px] py-3 rounded-[1.2rem] text-[10px] font-black shadow-2xl uppercase tracking-widest ${STATUS_CONFIG[sub.status].bg} ${STATUS_CONFIG[sub.status].text}`}>{STATUS_CONFIG[sub.status].label}</button>
                                                        <input className={`flex-1 bg-transparent border-none text-xl font-bold outline-none focus:ring-0 ${sub.status === 'received' ? 'line-through text-white/20 italic' : 'text-white'}`} value={sub.text} onChange={e => { const newSub = currentTask.subtasks.map(s => s.id === sub.id ? {...s, text: e.target.value} : s); setTasks(tasks.map(t => t.id === currentTask.id ? {...t, subtasks: newSub} : t)); }} />
                                                        <button onClick={() => { const newSub = currentTask.subtasks.filter(s => s.id !== sub.id); setTasks(tasks.map(t => t.id === currentTask.id ? {...t, subtasks: newSub} : t)); }} className="text-white/10 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2 text-xl">✕</button>
                                                    </div>
                                                    
                                                    <div className="ml-[124px] flex flex-wrap gap-6">
                                                        <div className="flex items-center gap-3 bg-blue-500/10 px-3 py-1.5 rounded-xl border border-blue-500/20">
                                                            <span className="text-[9px] font-black text-blue-400 uppercase opacity-60">📡 Sent:</span>
                                                            <input type="date" className="date-input-enhanced" value={formatDateForInput(sub.sentDate)} onChange={e => updateSubtaskDate(currentTask.id, sub.id, 'sentDate', e.target.value)} />
                                                        </div>
                                                        <div className="flex items-center gap-3 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20">
                                                            <span className="text-[9px] font-black text-emerald-400 uppercase opacity-60">✅ Recv:</span>
                                                            <input type="date" className="date-input-enhanced" value={formatDateForInput(sub.receivedDate)} onChange={e => updateSubtaskDate(currentTask.id, sub.id, 'receivedDate', e.target.value)} />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="mt-8">
                                            {activeBulkId === currentTask.id ? (
                                                <div className="space-y-4 animate-in slide-in-from-bottom-4 duration-300">
                                                    <textarea className="w-full h-32 p-6 bg-black/60 border border-white/10 rounded-[2rem] text-white text-lg outline-none focus:border-blue-500 transition-all shadow-inner custom-scrollbar" placeholder="貼上任務..." value={bulkText} onChange={e => setBulkText(e.target.value)} autoFocus />
                                                    <div className="flex gap-4 justify-end">
                                                        <button onClick={() => setActiveBulkId(null)} className="text-white/40 px-8 py-3 text-xs font-black uppercase">取消</button>
                                                        <button onClick={() => {
                                                            const lines = bulkText.split('\n').filter(line => line.trim() !== "");
                                                            if (lines.length === 0) { setActiveBulkId(null); return; }
                                                            const newSub = lines.map((text, i) => ({ id: Date.now() + i, text: text.trim(), status: 'pending', sentDate: '', receivedDate: '' }));
                                                            setTasks(tasks.map(t => t.id === currentTask.id ? { ...t, subtasks: [...t.subtasks, ...newSub] } : t));
                                                            setBulkText(""); setActiveBulkId(null);
                                                        }} className="bg-white text-black px-10 py-3 rounded-[2rem] text-xs font-black uppercase tracking-widest shadow-2xl hover:bg-blue-400 transition-all">執行注入</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <input className="w-full bg-white/5 border border-dashed border-white/20 rounded-[2rem] px-8 py-4 text-base outline-none focus:border-white/50 transition-all text-center placeholder-white/20 hover:bg-white/10 font-bold" placeholder="+ 新增細項" onKeyDown={e => { if (e.key === 'Enter') { 
                                                    const newSub = { id: Date.now(), text: e.target.value, status: 'pending', sentDate: '', receivedDate: '' };
                                                    setTasks(tasks.map(t => t.id === currentTask.id ? { ...t, subtasks: [...t.subtasks, newSub] } : t));
                                                    e.target.value = ""; 
                                                } }} />
                                            )}
                                        </div>
                                    </section>
                                </div>
                                
                                <div className="p-10 bg-black/60 text-center border-t border-white/10">
                                    <button onClick={() => confirm('確定銷毀？') && (setTasks(tasks.filter(t => t.id !== currentTask.id)), setSelectedTaskId(null))} className="text-[11px] font-black text-red-500/40 hover:text-red-500 transition-all uppercase tracking-[0.6em]">Destroy Matrix</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <footer className="mt-24 text-center opacity-10 text-[10px] font-black tracking-[1.5em] uppercase">
                        Nature Interface Online • Horseshoe Bend View
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
