<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人機上班專用任務追蹤 - Grid Pro Max</title>
    <!-- 引入 Google Fonts: Inter 與 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            /* 設定字體堆疊以符合 Gemini 視覺感 */
            --font-family-base: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-modal {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at center, #1e293b, #020617);
            min-height: 100vh;
            font-family: var(--font-family-base); /* 應用新字體 */
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.5);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .status-cycle-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 0.5);
        }
        /* 讓中文字符在 Inter 字體下不會變形 */
        input, textarea, select {
            font-family: var(--font-family-base);
        }
    </style>
</head>
<body class="text-slate-200 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GRADIENTS = [
            "from-blue-600/25 to-indigo-600/25",
            "from-purple-600/25 to-rose-600/25",
            "from-emerald-600/25 to-teal-600/25",
            "from-amber-600/25 to-orange-600/25"
        ];

        const STATUS_CONFIG = {
            pending: { 
                label: '未寄出', 
                bg: 'bg-gradient-to-r from-slate-600 to-slate-700', 
                text: 'text-white',
                next: 'sent'
            },
            sent: { 
                label: '已寄出', 
                bg: 'bg-gradient-to-r from-blue-500 to-indigo-500', 
                text: 'text-white',
                next: 'received'
            },
            received: { 
                label: '已收到', 
                bg: 'bg-gradient-to-r from-emerald-500 to-teal-500', 
                text: 'text-white',
                next: 'pending'
            }
        };

        function App() {
            const [view, setView] = useState('grid');
            
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_tracker');
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                return parsed.map(t => ({
                    ...t,
                    subtasks: t.subtasks.map(s => ({
                        ...s,
                        status: s.status || (s.completed ? 'received' : 'pending'),
                        sentDate: s.sentDate || '',
                        receivedDate: s.receivedDate || ''
                    }))
                }));
            });

            const [recurringTasks, setRecurringTasks] = useState(() => {
                const saved = localStorage.getItem('man_machine_recurring');
                return saved ? JSON.parse(saved) : [];
            });

            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("all");
            const [newProjTitle, setNewProjTitle] = useState("");
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [activeBulkId, setActiveBulkId] = useState(null);
            const [bulkText, setBulkText] = useState("");

            const [showRecurringForm, setShowRecurringForm] = useState(false);
            const [recForm, setRecForm] = useState({
                projectId: '',
                text: '',
                dayOfMonth: 1,
                notes: ''
            });

            useEffect(() => {
                localStorage.setItem('man_machine_tracker', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                localStorage.setItem('man_machine_recurring', JSON.stringify(recurringTasks));
            }, [recurringTasks]);

            const filteredTasks = useMemo(() => {
                let result = tasks.filter(t => {
                    const searchLower = searchTerm.toLowerCase();
                    const hasMatchingSubtask = t.subtasks.some(s => 
                        s.text.toLowerCase().includes(searchLower) && 
                        (statusFilter === "all" || s.status === statusFilter)
                    );
                    const titleMatches = t.title.toLowerCase().includes(searchLower) && 
                                       (statusFilter === "all" || t.subtasks.some(s => s.status === statusFilter));
                    
                    return hasMatchingSubtask || titleMatches;
                });
                return [...result].sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
            }, [tasks, searchTerm, statusFilter]);

            const currentTask = useMemo(() => tasks.find(t => t.id === selectedTaskId), [tasks, selectedTaskId]);

            const addProject = (e) => {
                e.preventDefault();
                if (!newProjTitle.trim()) return;
                const newProj = { 
                    id: Date.now(), 
                    title: newProjTitle, 
                    isPinned: false,
                    subtasks: [],
                    notes: "",
                    deadline: "",
                    gradientIndex: Math.floor(Math.random() * GRADIENTS.length)
                };
                setTasks([newProj, ...tasks]);
                setNewProjTitle("");
            };

            const cycleStatus = (taskId, subId) => {
                const today = new Date().toLocaleDateString('zh-TW');
                setTasks(tasks.map(t => {
                    if (t.id === taskId) {
                        return {
                            ...t,
                            subtasks: t.subtasks.map(s => {
                                if (s.id === subId) {
                                    const nextStatus = STATUS_CONFIG[s.status].next;
                                    const updated = { ...s, status: nextStatus };
                                    if (nextStatus === 'sent' && !s.sentDate) updated.sentDate = today;
                                    if (nextStatus === 'received' && !s.receivedDate) updated.receivedDate = today;
                                    return updated;
                                }
                                return s;
                            })
                        };
                    }
                    return t;
                }));
            };

            const handleBulkAdd = (projectId) => {
                const lines = bulkText.split('\n').filter(line => line.trim() !== "");
                if (lines.length === 0) { setActiveBulkId(null); return; }
                const newSub = lines.map((text, i) => ({ 
                    id: Date.now() + i, 
                    text: text.trim(), 
                    status: 'pending',
                    sentDate: '',
                    receivedDate: ''
                }));
                setTasks(tasks.map(t => t.id === projectId ? { ...t, subtasks: [...t.subtasks, ...newSub] } : t));
                setBulkText(""); setActiveBulkId(null);
            };

            const addRecurringTask = () => {
                if (!recForm.projectId || !recForm.text) return;
                const newTask = {
                    ...recForm,
                    id: Date.now(),
                    completions: []
                };
                setRecurringTasks([...recurringTasks, newTask]);
                setRecForm({ projectId: '', text: '', dayOfMonth: 1, notes: '' });
                setShowRecurringForm(false);
            };

            const toggleRecurringDone = (id) => {
                const currentMonth = new Date().toISOString().slice(0, 7);
                setRecurringTasks(recurringTasks.map(t => {
                    if (t.id === id) {
                        const isDone = t.completions.includes(currentMonth);
                        return {
                            ...t,
                            completions: isDone 
                                ? t.completions.filter(m => m !== currentMonth)
                                : [...t.completions, currentMonth]
                        };
                    }
                    return t;
                }));
            };

            const isDueSoon = (day) => {
                const today = new Date().getDate();
                const diff = day - today;
                return diff >= 0 && diff <= 5;
            };

            return (
                <div className="max-w-[1600px] mx-auto py-12 px-8">
                    <header className="mb-12 flex flex-col xl:flex-row xl:items-center justify-between gap-8">
                        <div className="flex items-center gap-6">
                            <div>
                                <h1 className="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400">
                                    人機上班專用任務追蹤
                                </h1>
                                <p className="text-slate-500 text-[10px] font-bold tracking-[0.4em] uppercase mt-2">Enhanced Matrix Interface v3.6</p>
                            </div>
                            <div className="flex bg-white/5 p-1 rounded-2xl border border-white/10">
                                <button 
                                    onClick={() => setView('grid')}
                                    className={`px-6 py-2 rounded-xl text-xs font-black uppercase transition-all ${view === 'grid' ? 'bg-blue-600 text-white shadow-lg' : 'text-white/40 hover:text-white/60'}`}
                                >
                                    主矩陣
                                </button>
                                <button 
                                    onClick={() => setView('monthly')}
                                    className={`px-6 py-2 rounded-xl text-xs font-black uppercase transition-all ${view === 'monthly' ? 'bg-purple-600 text-white shadow-lg' : 'text-white/40 hover:text-white/60'}`}
                                >
                                    📅 每月常規
                                </button>
                            </div>
                        </div>
                        
                        {view === 'grid' && (
                            <div className="flex flex-col sm:flex-row gap-4 items-center">
                                <select 
                                    className="bg-white/10 border border-white/20 rounded-2xl px-6 py-3 text-sm text-slate-200 outline-none focus:border-blue-500 transition-all cursor-pointer shadow-lg w-full sm:w-auto"
                                    value={statusFilter}
                                    onChange={e => setStatusFilter(e.target.value)}
                                >
                                    <option value="all">🔍 顯示所有專案</option>
                                    <option value="pending">⚠️ 待處理 (含未寄出)</option>
                                    <option value="sent">📡 追蹤中 (含已寄出)</option>
                                    <option value="received">✅ 已完成 (含已收到)</option>
                                </select>

                                <div className="relative group w-full sm:w-80">
                                    <input 
                                        type="text"
                                        placeholder="搜尋關鍵字..."
                                        className="bg-white/10 border border-white/20 rounded-2xl px-6 py-3 text-sm w-full outline-none focus:border-blue-500 transition-all shadow-lg"
                                        value={searchTerm}
                                        onChange={e => setSearchTerm(e.target.value)}
                                    />
                                    <span className="absolute right-5 top-3.5 opacity-40">🔍</span>
                                </div>
                            </div>
                        )}
                    </header>

                    {view === 'grid' ? (
                        <>
                            <form onSubmit={addProject} className="mb-14 flex gap-4">
                                <input 
                                    className="flex-1 bg-white/5 border border-white/10 rounded-2xl text-xl text-white placeholder-slate-600 px-8 py-5 focus:ring-2 focus:ring-blue-500/50 outline-none transition-all shadow-inner"
                                    placeholder="輸入新計畫或專案名稱..."
                                    value={newProjTitle}
                                    onChange={e => setNewProjTitle(e.target.value)}
                                />
                                <button className="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black text-xl hover:bg-blue-500 transition-all shadow-xl active:scale-95">＋</button>
                            </form>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-8">
                                {filteredTasks.map((task) => {
                                    const done = task.subtasks.filter(s => s.status === 'received').length;
                                    const total = task.subtasks.length;
                                    const progress = total === 0 ? 0 : Math.round((done / total) * 100);

                                    return (
                                        <div 
                                            key={task.id} 
                                            onClick={() => setSelectedTaskId(task.id)}
                                            className={`glass p-8 rounded-[2.5rem] cursor-pointer card-hover transition-all group relative bg-gradient-to-br ${GRADIENTS[task.gradientIndex || 0]} min-h-[280px] flex flex-col justify-between`}
                                        >
                                            <div>
                                                <div className="flex justify-between items-start mb-6">
                                                    <h3 className="font-bold text-2xl text-white leading-tight pr-4 drop-shadow-md">{task.title}</h3>
                                                    {task.isPinned && <span className="text-yellow-400 text-2xl drop-shadow-lg">★</span>}
                                                </div>
                                                
                                                <div className="mb-6">
                                                    <div className="flex justify-between items-end mb-3">
                                                        <span className="text-[10px] font-black text-white/50 uppercase tracking-widest">Efficiency</span>
                                                        <span className="text-lg font-black text-white">{progress}%</span>
                                                    </div>
                                                    <div className="h-2 w-full bg-black/30 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-blue-400 to-emerald-400 transition-all duration-700" style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                </div>

                                                <div className="space-y-3">
                                                    {task.subtasks.slice(0, 3).map(s => (
                                                        <div key={s.id} className="flex items-center gap-3 text-sm font-medium text-white/70">
                                                            <span className={`w-2 h-2 rounded-full shadow-sm ${s.status === 'received' ? 'bg-emerald-400' : s.status === 'sent' ? 'bg-blue-400' : 'bg-slate-500'}`}></span>
                                                            <span className="truncate">{s.text}</span>
                                                        </div>
                                                    ))}
                                                    {total > 3 && <p className="text-xs font-bold text-white/20 mt-3 pl-5 tracking-tighter italic">＋ {total - 3} more subtasks</p>}
                                                </div>
                                            </div>

                                            <div className="mt-8 pt-6 border-t border-white/10 flex justify-between items-center text-xs font-black text-white/40 uppercase tracking-[0.2em]">
                                                <div className="flex items-center gap-2">
                                                    <span className="opacity-50">📅</span>
                                                    <span>{task.deadline || "Ongoing"}</span>
                                                </div>
                                                <span className="group-hover:text-white transition-colors">Details →</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                                <div className="lg:col-span-1 space-y-8">
                                    <div className="glass p-8 rounded-[2.5rem]">
                                        <h2 className="text-2xl font-black text-white mb-6 flex items-center gap-3">
                                            ⚙️ 管理常規
                                            <button 
                                                onClick={() => setShowRecurringForm(true)}
                                                className="ml-auto bg-purple-600 text-white p-2 rounded-xl text-xs hover:bg-purple-500 transition-all"
                                            >
                                                新增任務
                                            </button>
                                        </h2>
                                        
                                        <div className="space-y-4 max-h-[600px] overflow-y-auto custom-scrollbar pr-2">
                                            {recurringTasks.length === 0 && <p className="text-white/20 text-center py-10 font-medium">尚未設定每月常規任務</p>}
                                            {recurringTasks.map(rt => {
                                                const proj = tasks.find(t => t.id == rt.projectId);
                                                const currentMonth = new Date().toISOString().slice(0, 7);
                                                const isDoneThisMonth = rt.completions.includes(currentMonth);
                                                const dueSoon = isDueSoon(rt.dayOfMonth);

                                                return (
                                                    <div key={rt.id} className="bg-white/5 border border-white/10 p-5 rounded-3xl group relative">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <span className="text-[10px] font-bold text-purple-400 uppercase tracking-widest">{proj?.title || '未知專案'}</span>
                                                            <button 
                                                                onClick={() => setRecurringTasks(recurringTasks.filter(t => t.id !== rt.id))}
                                                                className="text-white/10 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"
                                                            >✕</button>
                                                        </div>
                                                        <h4 className="text-white font-bold mb-3">{rt.text}</h4>
                                                        <div className="flex items-center justify-between">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-[10px] bg-white/10 px-2 py-1 rounded-lg text-white/60 font-medium">每月 {rt.dayOfMonth} 號</span>
                                                                {dueSoon && !isDoneThisMonth && (
                                                                    <span className="text-[10px] bg-rose-500/20 text-rose-400 px-2 py-1 rounded-lg font-black animate-pulse">⚠️ 倒數中</span>
                                                                )}
                                                            </div>
                                                            <button 
                                                                onClick={() => toggleRecurringDone(rt.id)}
                                                                className={`px-4 py-1.5 rounded-xl text-[10px] font-black uppercase transition-all ${isDoneThisMonth ? 'bg-emerald-500 text-white' : 'bg-white/10 text-white/40 hover:bg-white/20'}`}
                                                            >
                                                                {isDoneThisMonth ? '本月已完成' : '標記完成'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2">
                                    <div className="glass p-8 rounded-[2.5rem] h-full">
                                        <div className="flex justify-between items-center mb-10">
                                            <h2 className="text-2xl font-black text-white uppercase tracking-tighter">Monthly Routine Calendar</h2>
                                            <div className="text-right">
                                                <p className="text-xs font-black text-white/20 uppercase tracking-[0.3em]">
                                                    {new Date().toLocaleString('zh-TW', { month: 'long', year: 'numeric' })}
                                                </p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-7 gap-2 text-sm">
                                            {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => (
                                                <div key={d} className="text-center text-[10px] font-black text-white/20 pb-4">{d}</div>
                                            ))}
                                            {Array.from({ length: 31 }, (_, i) => i + 1).map(day => {
                                                const dayTasks = recurringTasks.filter(t => t.dayOfMonth == day);
                                                const currentMonth = new Date().toISOString().slice(0, 7);
                                                const today = new Date().getDate();

                                                return (
                                                    <div key={day} className={`min-h-[100px] p-2 rounded-2xl border transition-all ${day === today ? 'bg-blue-600/10 border-blue-500/50' : 'bg-white/5 border-white/5 hover:border-white/10'}`}>
                                                        <span className={`text-[10px] font-black ${day === today ? 'text-blue-400' : 'text-white/20'}`}>{day}</span>
                                                        <div className="mt-2 space-y-1">
                                                            {dayTasks.map(dt => (
                                                                <div 
                                                                    key={dt.id} 
                                                                    title={dt.notes}
                                                                    className={`text-[8px] p-1.5 rounded-lg font-bold truncate ${dt.completions.includes(currentMonth) ? 'bg-emerald-500/20 text-emerald-300 opacity-40' : 'bg-purple-500/20 text-purple-200 border border-purple-500/30'}`}
                                                                >
                                                                    {dt.text}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showRecurringForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setShowRecurringForm(false)}></div>
                            <div className="glass-modal w-full max-w-lg rounded-[3.5rem] p-10 relative z-10 animate-in zoom-in duration-300">
                                <h3 className="text-2xl font-black text-white mb-8 uppercase tracking-tighter">新增每月常規</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-2">選擇專案</label>
                                        <select 
                                            className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-purple-500 font-medium"
                                            value={recForm.projectId}
                                            onChange={e => setRecForm({...recForm, projectId: e.target.value})}
                                        >
                                            <option value="">請選擇專案...</option>
                                            {tasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-2">任務內容</label>
                                        <input 
                                            className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-purple-500 font-medium"
                                            placeholder="例如：月報彙整"
                                            value={recForm.text}
                                            onChange={e => setRecForm({...recForm, text: e.target.value})}
                                        />
                                    </div>
                                    <div className="flex gap-6">
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-2">每月幾號</label>
                                            <input 
                                                type="number" min="1" max="31"
                                                className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white outline-none focus:border-purple-500 font-medium"
                                                value={recForm.dayOfMonth}
                                                onChange={e => setRecForm({...recForm, dayOfMonth: parseInt(e.target.value)})}
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-purple-400 uppercase tracking-widest block mb-2">備註</label>
                                        <textarea 
                                            className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm text-white outline-none focus:border-purple-500 h-24 font-medium"
                                            placeholder="注意事項..."
                                            value={recForm.notes}
                                            onChange={e => setRecForm({...recForm, notes: e.target.value})}
                                        />
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button onClick={() => setShowRecurringForm(false)} className="flex-1 text-white/40 font-bold uppercase py-4">取消</button>
                                        <button onClick={addRecurringTask} className="flex-1 bg-purple-600 text-white rounded-2xl font-black uppercase py-4 shadow-xl hover:bg-purple-500 transition-all">確認新增</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedTaskId && currentTask && view === 'grid' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 md:p-12">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setSelectedTaskId(null)}></div>
                            <div className="glass-modal w-full max-w-4xl max-h-[90vh] rounded-[3.5rem] shadow-2xl relative z-10 flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
                                <div className="p-10 border-b border-white/10 flex justify-between items-center bg-white/5">
                                    <div className="flex-1">
                                        <input 
                                            className="text-3xl font-black text-white bg-transparent border-none focus:ring-0 w-full mb-2"
                                            value={currentTask.title}
                                            onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, title: e.target.value} : t))}
                                        />
                                        <div className="flex items-center gap-6">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Target Date</span>
                                                <input 
                                                    type="date"
                                                    className="bg-transparent text-sm font-bold text-blue-400 outline-none"
                                                    value={currentTask.deadline}
                                                    onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, deadline: e.target.value} : t))}
                                                />
                                            </div>
                                            <button 
                                                onClick={() => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, isPinned: !t.isPinned} : t))}
                                                className={`text-xs font-bold tracking-widest uppercase py-1 px-3 rounded-lg border transition-all ${currentTask.isPinned ? 'text-yellow-400 border-yellow-400/50 bg-yellow-400/10' : 'text-white/20 border-white/10 hover:border-white/30'}`}
                                            >
                                                {currentTask.isPinned ? "★ Pinned" : "☆ Pin Project"}
                                            </button>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedTaskId(null)} className="text-white/20 hover:text-white text-4xl p-4 transition-colors">✕</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-10 space-y-12 custom-scrollbar">
                                    <section>
                                        <label className="text-xs font-bold text-blue-400 uppercase tracking-[0.2em] block mb-4">Project Insights / Notes</label>
                                        <textarea 
                                            className="w-full bg-white/5 border border-white/10 rounded-3xl p-6 text-base text-slate-300 focus:border-blue-500/50 outline-none resize-none h-32 leading-relaxed transition-all font-medium"
                                            placeholder="在此記錄關鍵發現或代辦細節..."
                                            value={currentTask.notes}
                                            onChange={e => setTasks(tasks.map(t => t.id === currentTask.id ? {...t, notes: e.target.value} : t))}
                                        />
                                    </section>

                                    <section>
                                        <div className="flex justify-between items-center mb-6">
                                            <label className="text-xs font-bold text-blue-400 uppercase tracking-[0.2em]">Operational Subtasks</label>
                                            <button onClick={() => setActiveBulkId(currentTask.id)} className="text-[11px] font-black text-white/30 hover:text-blue-400 transition-colors bg-white/5 px-4 py-1.5 rounded-full border border-white/10">⚡ 批量處理模式</button>
                                        </div>
                                        
                                        <div className="space-y-4 font-medium">
                                            {currentTask.subtasks.map(sub => (
                                                <div key={sub.id} className="flex flex-col gap-2 p-5 rounded-3xl bg-white/5 border border-white/5 group hover:bg-white/[0.07] transition-all">
                                                    <div className="flex items-center gap-6">
                                                        <button 
                                                            onClick={() => cycleStatus(currentTask.id, sub.id)}
                                                            className={`status-cycle-btn min-w-[100px] py-2.5 rounded-2xl text-xs font-bold shadow-xl uppercase tracking-wider ${STATUS_CONFIG[sub.status].bg} ${STATUS_CONFIG[sub.status].text}`}
                                                        >
                                                            {STATUS_CONFIG[sub.status].label}
                                                        </button>

                                                        <input 
                                                            className={`flex-1 bg-transparent border-none text-lg font-medium outline-none focus:ring-0 ${sub.status === 'received' ? 'line-through text-white/20' : 'text-white'}`}
                                                            value={sub.text}
                                                            onChange={e => {
                                                                const newSub = currentTask.subtasks.map(s => s.id === sub.id ? {...s, text: e.target.value} : s);
                                                                setTasks(tasks.map(t => t.id === currentTask.id ? {...t, subtasks: newSub} : t));
                                                            }}
                                                        />
                                                        
                                                        <button 
                                                            onClick={() => {
                                                                const newSub = currentTask.subtasks.filter(s => s.id !== sub.id);
                                                                setTasks(tasks.map(t => t.id === currentTask.id ? {...t, subtasks: newSub} : t));
                                                            }}
                                                            className="text-white/10 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2 text-xl"
                                                        >✕</button>
                                                    </div>
                                                    
                                                    {(sub.sentDate || sub.receivedDate) && (
                                                        <div className="ml-[124px] flex flex-wrap gap-6 text-[11px] font-black uppercase tracking-widest">
                                                            {sub.sentDate && (
                                                                <div className="flex items-center gap-2 text-blue-400 bg-blue-400/10 px-3 py-1 rounded-lg border border-blue-400/20">
                                                                    <span className="opacity-50">📡 SENT:</span> 
                                                                    <span>{sub.sentDate}</span>
                                                                </div>
                                                            )}
                                                            {sub.receivedDate && (
                                                                <div className="flex items-center gap-2 text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded-lg border border-emerald-400/20">
                                                                    <span className="opacity-50">✅ RECV:</span> 
                                                                    <span>{sub.receivedDate}</span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        <div className="mt-6">
                                            {activeBulkId === currentTask.id ? (
                                                <div className="space-y-4 animate-in slide-in-from-bottom-2 duration-300">
                                                    <textarea 
                                                        className="w-full h-40 p-6 bg-black/40 border border-white/10 rounded-3xl text-white text-sm outline-none focus:border-blue-500 transition-all shadow-inner custom-scrollbar font-medium"
                                                        placeholder="請輸入任務，一行代表一個細項..."
                                                        value={bulkText}
                                                        onChange={e => setBulkText(e.target.value)}
                                                        autoFocus
                                                    />
                                                    <div className="flex gap-3 justify-end">
                                                        <button onClick={() => setActiveBulkId(null)} className="text-white/40 px-6 py-3 text-xs font-bold uppercase hover:text-white transition-colors">Cancel</button>
                                                        <button onClick={() => handleBulkAdd(currentTask.id)} className="bg-white text-black px-8 py-3 rounded-2xl text-xs font-black uppercase tracking-widest shadow-lg hover:bg-blue-400 transition-all">Execute Bulk Inject</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <input 
                                                    className="w-full bg-white/5 border border-dashed border-white/20 rounded-2xl px-6 py-4 text-sm outline-none focus:border-white/50 transition-all text-center placeholder-white/20 hover:bg-white/10 font-medium"
                                                    placeholder="+ 點擊或輸入後按 Enter 快速新增細項"
                                                    onKeyDown={e => {
                                                        if (e.key === 'Enter') {
                                                            setBulkText(e.target.value);
                                                            handleBulkAdd(currentTask.id);
                                                            e.target.value = "";
                                                        }
                                                    }}
                                                />
                                            )}
                                        </div>
                                    </section>
                                </div>
                                
                                <div className="p-8 bg-black/40 text-center border-t border-white/5">
                                    <button 
                                        onClick={() => confirm('警告：確定要永久刪除此專案矩陣嗎？') && (setTasks(tasks.filter(t => t.id !== currentTask.id)), setSelectedTaskId(null))}
                                        className="text-[11px] font-bold text-red-500/30 hover:text-red-500 transition-all uppercase tracking-[0.4em] hover:tracking-[0.5em]"
                                    >
                                        Destroy Matrix Permanently
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <footer className="mt-24 text-center opacity-10 text-[10px] font-black tracking-[1em] uppercase">
                        End of Line • Matrix Interface Online
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
